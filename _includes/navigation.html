<header>
<div id="nav_container">
<nav>
  <ul>
  <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    {% for link in site.navigation %}
      {% assign current = nil %}
      {% if page.url == link.url %}
        {% assign current = 'current' %}
      {% endif %}
      <li class="{{ current }}">
        <a class="{{ current }}" href="{{ link.url | relative_url }}">{{ link.text }}</a>
      </li>
    {% endfor %}
  </ul>
</nav>
</div>
</header>
